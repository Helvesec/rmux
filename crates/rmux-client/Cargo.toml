[package]
rust-version.workspace = true
name = "rmux-client"
version = "0.11.0"
edition.workspace = true
publish = true
license.workspace = true
repository.workspace = true
description = "Blocking local client and attach-mode plumbing for the RMUX terminal multiplexer."
keywords = ["terminal", "multiplexer", "client"]
categories = ["command-line-interface"]

[dependencies]
rmux-bootstrap = { path = "../rmux-bootstrap", version = "0.11.0" }
rmux-core = { path = "../rmux-core", version = "0.11.0" }
rmux-ipc = { path = "../rmux-ipc", version = "0.11.0" }
rmux-os = { path = "../rmux-os", version = "0.11.0" }
rmux-proto = { path = "../rmux-proto", version = "0.11.0" }
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2.185"
rustix = { version = "1.1.4", features = ["event", "net", "process", "termios"] }
signal-hook = "0.3.18"
tokio = { version = "1.48.0", features = ["net", "rt", "time"] }

[target.'cfg(windows)'.dependencies]
tokio = { version = "1.48.0", features = ["io-util", "macros", "rt", "sync", "time"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse"] }

[dev-dependencies]
rmux-pty = { path = "../rmux-pty", version = "0.11.0" }
rmux-server = { path = "../rmux-server", version = "0.11.0" }
tokio = { version = "1", features = ["io-util", "rt-multi-thread", "macros", "net", "time"] }

[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1.1.4", features = ["event", "pipe", "process"] }

# Preserve 64-bit counters on targets without native 64-bit atomics.
[target.'cfg(not(target_has_atomic = "64"))'.dependencies]
portable-atomic = { version = "1.13.1", default-features = false, features = ["fallback"] }
