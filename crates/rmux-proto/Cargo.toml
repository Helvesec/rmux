[package]
rust-version.workspace = true
name = "rmux-proto"
version = "0.11.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "RMUX detached IPC protocol DTOs, framing, and wire-safe error types."
keywords = ["terminal", "multiplexer", "protocol"]
categories = ["command-line-interface", "asynchronous"]
publish = true

[dependencies]
bincode = "1.3.3"
rmux-types = { path = "../rmux-types", version = "0.11.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
thiserror = "2.0"

[features]
fuzzing = []

# Preserve 64-bit counters on targets without native 64-bit atomics.
[target.'cfg(not(target_has_atomic = "64"))'.dev-dependencies]
portable-atomic = { version = "1.13.1", default-features = false, features = ["fallback"] }
