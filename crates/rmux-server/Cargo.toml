[package]
rust-version.workspace = true
name = "rmux-server"
version = "0.11.0"
edition.workspace = true
publish = true
license.workspace = true
repository.workspace = true
description = "Tokio daemon and request dispatcher for the RMUX terminal multiplexer."
keywords = ["terminal", "multiplexer", "daemon"]
categories = ["command-line-interface"]

[dependencies]
async-recursion = "=1.1.1"
base64 = { version = "0.22", optional = true }
bincode = "1.3.3"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
getrandom = "0.3"
glob = "0.3"
hkdf = { version = "0.12", optional = true }
httparse = { version = "1.9", optional = true }
regex = "1.12.2"
rmux-core = { path = "../rmux-core", version = "0.11.0" }
rmux-ipc = { path = "../rmux-ipc", version = "0.11.0" }
rmux-os = { path = "../rmux-os", version = "0.11.0" }
rmux-proto = { path = "../rmux-proto", version = "0.11.0" }
rmux-pty = { path = "../rmux-pty", version = "0.11.0" }
rmux-web-crypto = { path = "../rmux-web-crypto", version = "0.11.0", optional = true }
zeroize = { version = "1", default-features = false, optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = "1"
sha1 = { version = "0.10", optional = true }
sha2 = { version = "0.10", optional = true }
subtle = { version = "2.6", optional = true }
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "sync", "time"] }
toml = { version = "0.8", optional = true }
tracing = "0.1"

[features]
default = ["web"]
web = [
    "dep:base64",
    "dep:hkdf",
    "dep:httparse",
    "dep:rmux-web-crypto",
    "dep:serde",
    "dep:sha1",
    "dep:sha2",
    "dep:subtle",
    "dep:toml",
    "dep:zeroize",
]
fuzzing = []

[target.'cfg(unix)'.dependencies]
rmux-bootstrap = { path = "../rmux-bootstrap", version = "0.11.0" }
rustix = { version = "1.1.4", features = ["event", "fs", "net", "process"] }

[dev-dependencies]
rmux-os = { path = "../rmux-os", version = "0.11.0", features = ["test-seams"] }
rmux-core = { path = "../rmux-core", version = "0.11.0", features = ["test-seams", "kitty-keyboard"] }
rmux-pty = { path = "../rmux-pty", version = "0.11.0", features = ["test-seams"] }
rustix = { version = "1.1.4", features = ["event", "fs", "termios"] }
serde_json = "1"
static_assertions = "1.1"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "test-util"] }
