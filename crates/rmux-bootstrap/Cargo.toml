[package]
rust-version.workspace = true
name = "rmux-bootstrap"
version.workspace = true
edition.workspace = true
publish = true
license.workspace = true
repository.workspace = true
description = "Internal daemon startup coordination shared by RMUX runtime clients."

[dependencies]
rmux-ipc = { path = "../rmux-ipc", version = "0.11.0" }
rmux-os = { path = "../rmux-os", version = "0.11.0" }
tokio = { version = "1.48.0", features = ["net", "rt", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1.1.4", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
rmux-proto = { path = "../rmux-proto", version = "0.11.0" }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation"] }

[dev-dependencies]
tokio = { version = "1.48.0", features = ["io-util", "macros", "rt-multi-thread"] }
