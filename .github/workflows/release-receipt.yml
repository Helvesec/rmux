name: Immutable GitHub Release receipt

on:
  workflow_dispatch:
    inputs:
      authorization_run_id: {required: true, type: string}
      authorization_artifact_id: {required: true, type: string}
      authorization_artifact_digest: {required: true, type: string}
      authorization_envelope_artifact_id: {required: true, type: string}
      authorization_envelope_artifact_digest: {required: true, type: string}
      authorization_workflow_id: {required: true, type: string}
      expected_source_sha: {required: true, type: string}
      release_id: {required: true, type: string}
      release_ref: {required: true, type: string}
      release_kind:
        required: true
        type: choice
        options: [rc, stable]
      receipt_workflow_id: {required: true, type: string}
      failed_receipt_run_id:
        required: false
        type: string
        default: ""
      snap_candidate_opt_in:
        required: false
        type: boolean
        default: false

concurrency:
  group: rmux-release-receipt-${{ inputs.release_ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  receipt-only:
    name: Verify immutable Release and create receipt
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    outputs:
      receipt_artifact_id: ${{ steps.receipt.outputs.receipt_artifact_id }}
      receipt_artifact_digest: ${{ steps.receipt.outputs.receipt_artifact_digest }}
      envelope_artifact_id: ${{ steps.receipt.outputs.envelope_artifact_id }}
      envelope_artifact_digest: ${{ steps.receipt.outputs.envelope_artifact_digest }}
      receipt_predicate_sha256: ${{ steps.receipt.outputs.receipt_predicate_sha256 }}
      receipt_envelope_sha256: ${{ steps.receipt.outputs.receipt_envelope_sha256 }}
    env:
      RMUX_AUTHORIZATION_RUN_ID: ${{ inputs.authorization_run_id }}
      RMUX_AUTHORIZATION_ARTIFACT_ID: ${{ inputs.authorization_artifact_id }}
      RMUX_AUTHORIZATION_ARTIFACT_DIGEST: ${{ inputs.authorization_artifact_digest }}
      RMUX_AUTHORIZATION_ENVELOPE_ARTIFACT_ID: ${{ inputs.authorization_envelope_artifact_id }}
      RMUX_AUTHORIZATION_ENVELOPE_ARTIFACT_DIGEST: ${{ inputs.authorization_envelope_artifact_digest }}
      RMUX_AUTHORIZATION_WORKFLOW_ID: ${{ inputs.authorization_workflow_id }}
      RMUX_EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
      RMUX_RELEASE_ID: ${{ inputs.release_id }}
      RMUX_RELEASE_REF: ${{ inputs.release_ref }}
      RMUX_RELEASE_KIND: ${{ inputs.release_kind }}
      RMUX_RECEIPT_WORKFLOW_ID: ${{ inputs.receipt_workflow_id }}
      RMUX_FAILED_RECEIPT_RUN_ID: ${{ inputs.failed_receipt_run_id }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - id: receipt
        name: Create exact immutable Release receipt
        uses: ./.github/actions/release-receipt-create

  audit-downstream-authority:
    name: Audit live downstream repository authority
    needs: receipt-only
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    environment: release-publication
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.audit.outputs.artifact-id }}
      artifact_digest: ${{ steps.audit.outputs.artifact-digest }}
    env:
      RMUX_EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
      RMUX_FAILED_RECEIPT_RUN_ID: ${{ inputs.failed_receipt_run_id }}
    steps:
      - name: Reject malformed or stale audit identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Helvesec/rmux"
          test "$GITHUB_REPOSITORY_ID" = "1239918790"
          test "$GITHUB_RUN_ATTEMPT" = 1
          [[ "$RMUX_EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [ -n "$RMUX_FAILED_RECEIPT_RUN_ID" ]; then
            test "$GITHUB_REF" = refs/heads/main
          else
            test "$GITHUB_SHA" = "$RMUX_EXPECTED_SOURCE_SHA"
            [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - id: audit
        name: Audit exact downstream repository authority
        uses: ./.github/actions/release-downstream-audit
        with:
          app-id: ${{ vars.RMUX_DOWNSTREAM_APP_ID }}
          app-private-key: ${{ secrets.RMUX_DOWNSTREAM_APP_PRIVATE_KEY }}
          expected-source-sha: ${{ inputs.expected_source_sha }}

  downstream-preparation:
    name: Prepare receipt-gated downstream publication
    needs: [receipt-only, audit-downstream-authority]
    uses: ./.github/workflows/release-downstream.yml
    permissions:
      actions: read
      contents: read
    with:
      receipt_run_id: ${{ github.run_id }}
      receipt_run_workflow_id: ${{ inputs.receipt_workflow_id }}
      receipt_workflow_id: ${{ inputs.receipt_workflow_id }}
      receipt_artifact_id: ${{ needs.receipt-only.outputs.receipt_artifact_id }}
      receipt_artifact_digest: ${{ needs.receipt-only.outputs.receipt_artifact_digest }}
      receipt_envelope_artifact_id: ${{ needs.receipt-only.outputs.envelope_artifact_id }}
      receipt_envelope_artifact_digest: ${{ needs.receipt-only.outputs.envelope_artifact_digest }}
      receipt_predicate_sha256: ${{ needs.receipt-only.outputs.receipt_predicate_sha256 }}
      receipt_envelope_sha256: ${{ needs.receipt-only.outputs.receipt_envelope_sha256 }}
      downstream_audit_run_id: ${{ github.run_id }}
      downstream_audit_workflow_id: ${{ inputs.receipt_workflow_id }}
      downstream_audit_artifact_id: ${{ needs.audit-downstream-authority.outputs.artifact_id }}
      downstream_audit_artifact_digest: ${{ needs.audit-downstream-authority.outputs.artifact_digest }}
      expected_source_sha: ${{ inputs.expected_source_sha }}
      release_id: ${{ inputs.release_id }}
      release_ref: ${{ inputs.release_ref }}
      release_kind: ${{ inputs.release_kind }}
      snap_candidate_opt_in: ${{ inputs.snap_candidate_opt_in }}

  preflight-crates-oidc:
    name: Verify crates.io Trusted Publishing authority
    needs: [downstream-preparation]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    environment: release
    permissions:
      id-token: write
    steps:
      - name: Exchange and revoke a preflight crates.io token
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18

  build-linux-repository:
    name: Build exact signed Linux repository trees
    needs: [downstream-preparation]
    if: inputs.release_kind == 'stable'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    environment: release
    permissions:
      actions: read
      contents: read
    outputs:
      repository_artifact_id: ${{ steps.build.outputs.repository-artifact-id }}
      repository_artifact_digest: ${{ steps.build.outputs.repository-artifact-digest }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: {persist-credentials: false}
      - id: build
        uses: ./.github/actions/release-linux-repository-build
        with:
          receipt-run-id: ${{ github.run_id }}
          payload-artifact-id: ${{ fromJSON(needs.downstream-preparation.outputs.payload_artifact_ids).apt_rpm }}
          payload-artifact-digest: ${{ fromJSON(needs.downstream-preparation.outputs.payload_artifact_digests).apt_rpm }}
          source-sha: ${{ inputs.expected_source_sha }}
          release-id: ${{ inputs.release_id }}
          release-ref: ${{ inputs.release_ref }}
          apt-gpg-private-key: ${{ secrets.RMUX_APT_GPG_PRIVATE_KEY }}
          apt-gpg-key: ${{ secrets.RMUX_APT_GPG_KEY }}
          rpm-gpg-private-key: ${{ secrets.RMUX_RPM_GPG_PRIVATE_KEY }}
          rpm-gpg-key: ${{ secrets.RMUX_RPM_GPG_KEY }}
          rpm-repo-gpg-private-key: ${{ secrets.RMUX_RPM_REPO_GPG_PRIVATE_KEY }}
          rpm-repo-gpg-key: ${{ secrets.RMUX_RPM_REPO_GPG_KEY }}

  publish-homebrew-tap:
    name: Publish exact Homebrew tap formula
    needs: [downstream-preparation, preflight-crates-oidc]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    environment: release-publication
    concurrency:
      group: rmux-channel-homebrew-tap-${{ inputs.release_ref }}
      cancel-in-progress: false
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: {persist-credentials: false}
      - uses: ./.github/actions/release-owned-repository-publish
        with:
          channel: homebrew_tap
          receipt-run-id: ${{ github.run_id }}
          plan-artifact-id: ${{ needs.downstream-preparation.outputs.plan_artifact_id }}
          plan-artifact-digest: ${{ needs.downstream-preparation.outputs.plan_artifact_digest }}
          payload-artifact-id: ${{ fromJSON(needs.downstream-preparation.outputs.payload_artifact_ids).homebrew_tap }}
          payload-artifact-digest: ${{ fromJSON(needs.downstream-preparation.outputs.payload_artifact_digests).homebrew_tap }}
          source-sha: ${{ inputs.expected_source_sha }}
          release-id: ${{ inputs.release_id }}
          release-ref: ${{ inputs.release_ref }}
          app-id: ${{ vars.RMUX_DOWNSTREAM_APP_ID }}
          app-private-key: ${{ secrets.RMUX_DOWNSTREAM_APP_PRIVATE_KEY }}

  publish-scoop:
    name: Publish exact Scoop manifest
    needs: [downstream-preparation, preflight-crates-oidc]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    environment: release-publication
    concurrency:
      group: rmux-channel-scoop-${{ inputs.release_ref }}
      cancel-in-progress: false
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: {persist-credentials: false}
      - uses: ./.github/actions/release-owned-repository-publish
        with:
          channel: scoop
          receipt-run-id: ${{ github.run_id }}
          plan-artifact-id: ${{ needs.downstream-preparation.outputs.plan_artifact_id }}
          plan-artifact-digest: ${{ needs.downstream-preparation.outputs.plan_artifact_digest }}
          payload-artifact-id: ${{ fromJSON(needs.downstream-preparation.outputs.payload_artifact_ids).scoop }}
          payload-artifact-digest: ${{ fromJSON(needs.downstream-preparation.outputs.payload_artifact_digests).scoop }}
          source-sha: ${{ inputs.expected_source_sha }}
          release-id: ${{ inputs.release_id }}
          release-ref: ${{ inputs.release_ref }}
          app-id: ${{ vars.RMUX_DOWNSTREAM_APP_ID }}
          app-private-key: ${{ secrets.RMUX_DOWNSTREAM_APP_PRIVATE_KEY }}

  publish-web-share:
    name: Publish exact Web Share WASM bytes
    needs: [downstream-preparation, preflight-crates-oidc]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    environment: release-publication
    concurrency:
      group: rmux-channel-web-share-${{ inputs.release_ref }}
      cancel-in-progress: false
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: {persist-credentials: false}
      - uses: ./.github/actions/release-owned-repository-publish
        with:
          channel: web_share
          receipt-run-id: ${{ github.run_id }}
          plan-artifact-id: ${{ needs.downstream-preparation.outputs.plan_artifact_id }}
          plan-artifact-digest: ${{ needs.downstream-preparation.outputs.plan_artifact_digest }}
          payload-artifact-id: ${{ fromJSON(needs.downstream-preparation.outputs.payload_artifact_ids).web_share }}
          payload-artifact-digest: ${{ fromJSON(needs.downstream-preparation.outputs.payload_artifact_digests).web_share }}
          source-sha: ${{ inputs.expected_source_sha }}
          release-id: ${{ inputs.release_id }}
          release-ref: ${{ inputs.release_ref }}
          app-id: ${{ vars.RMUX_DOWNSTREAM_APP_ID }}
          app-private-key: ${{ secrets.RMUX_DOWNSTREAM_APP_PRIVATE_KEY }}

  publish-linux-repository:
    name: Publish exact signed APT and RPM repositories
    needs: [downstream-preparation, preflight-crates-oidc, build-linux-repository, publish-homebrew-tap, publish-scoop, publish-web-share]
    if: ${{ !cancelled() && !failure() && inputs.release_kind == 'stable' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    environment: release-publication
    concurrency:
      group: rmux-channel-apt-rpm-${{ inputs.release_ref }}
      cancel-in-progress: false
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: {persist-credentials: false}
      - uses: ./.github/actions/release-linux-repository-publish
        with:
          receipt-run-id: ${{ github.run_id }}
          plan-artifact-id: ${{ needs.downstream-preparation.outputs.plan_artifact_id }}
          plan-artifact-digest: ${{ needs.downstream-preparation.outputs.plan_artifact_digest }}
          payload-artifact-id: ${{ fromJSON(needs.downstream-preparation.outputs.payload_artifact_ids).apt_rpm }}
          payload-artifact-digest: ${{ fromJSON(needs.downstream-preparation.outputs.payload_artifact_digests).apt_rpm }}
          repository-artifact-id: ${{ needs.build-linux-repository.outputs.repository_artifact_id }}
          repository-artifact-digest: ${{ needs.build-linux-repository.outputs.repository_artifact_digest }}
          source-sha: ${{ inputs.expected_source_sha }}
          release-id: ${{ inputs.release_id }}
          release-ref: ${{ inputs.release_ref }}
          app-id: ${{ vars.RMUX_DOWNSTREAM_APP_ID }}
          app-private-key: ${{ secrets.RMUX_DOWNSTREAM_APP_PRIVATE_KEY }}

  record-linux-repository-policy:
    name: Record denied RC Linux repository channel
    needs: [downstream-preparation, build-linux-repository, publish-homebrew-tap, publish-scoop, publish-web-share]
    if: ${{ !cancelled() && !failure() && inputs.release_kind == 'rc' }}
    uses: ./.github/workflows/release-policy-channel.yml
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    with:
      channel: apt_rpm
      receipt_run_id: ${{ github.run_id }}
      plan_artifact_id: ${{ needs.downstream-preparation.outputs.plan_artifact_id }}
      plan_artifact_digest: ${{ needs.downstream-preparation.outputs.plan_artifact_digest }}
      payload_artifact_id: ${{ fromJSON(needs.downstream-preparation.outputs.payload_artifact_ids).apt_rpm }}
      payload_artifact_digest: ${{ fromJSON(needs.downstream-preparation.outputs.payload_artifact_digests).apt_rpm }}
      expected_source_sha: ${{ inputs.expected_source_sha }}
      release_id: ${{ inputs.release_id }}
      release_ref: ${{ inputs.release_ref }}

  publish-crates:
    name: Publish exact crates.io package set
    needs: [downstream-preparation, preflight-crates-oidc, build-linux-repository, publish-homebrew-tap, publish-scoop, publish-web-share]
    if: ${{ !cancelled() && !failure() }}
    uses: ./.github/workflows/release-crates-channel.yml
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    with:
      receipt_run_id: ${{ github.run_id }}
      plan_artifact_id: ${{ needs.downstream-preparation.outputs.plan_artifact_id }}
      plan_artifact_digest: ${{ needs.downstream-preparation.outputs.plan_artifact_digest }}
      payload_artifact_id: ${{ fromJSON(needs.downstream-preparation.outputs.payload_artifact_ids).crates_io }}
      payload_artifact_digest: ${{ fromJSON(needs.downstream-preparation.outputs.payload_artifact_digests).crates_io }}
      expected_source_sha: ${{ inputs.expected_source_sha }}
      release_id: ${{ inputs.release_id }}
      release_ref: ${{ inputs.release_ref }}

  record-homebrew-core:
    name: Record manual Homebrew Core submission
    needs: [downstream-preparation, publish-linux-repository, record-linux-repository-policy, publish-crates]
    if: ${{ !cancelled() && !failure() }}
    uses: ./.github/workflows/release-policy-channel.yml
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    with:
      channel: homebrew_core
      receipt_run_id: ${{ github.run_id }}
      plan_artifact_id: ${{ needs.downstream-preparation.outputs.plan_artifact_id }}
      plan_artifact_digest: ${{ needs.downstream-preparation.outputs.plan_artifact_digest }}
      payload_artifact_id: ${{ fromJSON(needs.downstream-preparation.outputs.payload_artifact_ids).homebrew_core }}
      payload_artifact_digest: ${{ fromJSON(needs.downstream-preparation.outputs.payload_artifact_digests).homebrew_core }}
      expected_source_sha: ${{ inputs.expected_source_sha }}
      release_id: ${{ inputs.release_id }}
      release_ref: ${{ inputs.release_ref }}

  record-winget:
    name: Record manual WinGet submission
    needs: [downstream-preparation, publish-linux-repository, record-linux-repository-policy, publish-crates]
    if: ${{ !cancelled() && !failure() }}
    uses: ./.github/workflows/release-policy-channel.yml
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    with:
      channel: winget
      receipt_run_id: ${{ github.run_id }}
      plan_artifact_id: ${{ needs.downstream-preparation.outputs.plan_artifact_id }}
      plan_artifact_digest: ${{ needs.downstream-preparation.outputs.plan_artifact_digest }}
      payload_artifact_id: ${{ fromJSON(needs.downstream-preparation.outputs.payload_artifact_ids).winget }}
      payload_artifact_digest: ${{ fromJSON(needs.downstream-preparation.outputs.payload_artifact_digests).winget }}
      expected_source_sha: ${{ inputs.expected_source_sha }}
      release_id: ${{ inputs.release_id }}
      release_ref: ${{ inputs.release_ref }}

  record-snap-stable:
    name: Record disabled Snap stable channel
    needs: [downstream-preparation, publish-linux-repository, record-linux-repository-policy, publish-crates]
    if: ${{ !cancelled() && !failure() }}
    uses: ./.github/workflows/release-policy-channel.yml
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    with:
      channel: snap_stable
      receipt_run_id: ${{ github.run_id }}
      plan_artifact_id: ${{ needs.downstream-preparation.outputs.plan_artifact_id }}
      plan_artifact_digest: ${{ needs.downstream-preparation.outputs.plan_artifact_digest }}
      payload_artifact_id: ${{ fromJSON(needs.downstream-preparation.outputs.payload_artifact_ids).snap_stable }}
      payload_artifact_digest: ${{ fromJSON(needs.downstream-preparation.outputs.payload_artifact_digests).snap_stable }}
      expected_source_sha: ${{ inputs.expected_source_sha }}
      release_id: ${{ inputs.release_id }}
      release_ref: ${{ inputs.release_ref }}

  publish-chocolatey:
    name: Submit exact Chocolatey package
    needs: [downstream-preparation, publish-linux-repository, record-linux-repository-policy, publish-crates]
    if: ${{ !cancelled() && !failure() }}
    runs-on: windows-latest
    timeout-minutes: 30
    environment: release
    concurrency:
      group: rmux-channel-chocolatey-${{ inputs.release_ref }}
      cancel-in-progress: false
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: {persist-credentials: false}
      - uses: ./.github/actions/release-chocolatey-publish
        with:
          receipt-run-id: ${{ github.run_id }}
          plan-artifact-id: ${{ needs.downstream-preparation.outputs.plan_artifact_id }}
          plan-artifact-digest: ${{ needs.downstream-preparation.outputs.plan_artifact_digest }}
          payload-artifact-id: ${{ fromJSON(needs.downstream-preparation.outputs.payload_artifact_ids).chocolatey }}
          payload-artifact-digest: ${{ fromJSON(needs.downstream-preparation.outputs.payload_artifact_digests).chocolatey }}
          source-sha: ${{ inputs.expected_source_sha }}
          release-id: ${{ inputs.release_id }}
          release-ref: ${{ inputs.release_ref }}
          api-key: ${{ secrets.CHOCOLATEY_API_KEY }}

  publish-snap-candidate:
    name: Publish exact Snap candidate revisions
    needs: [downstream-preparation, record-homebrew-core, record-winget, record-snap-stable, publish-chocolatey]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    environment: release
    concurrency:
      group: rmux-channel-snap-candidate-${{ inputs.release_ref }}
      cancel-in-progress: false
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: {persist-credentials: false}
      - uses: ./.github/actions/release-snap-publish
        with:
          receipt-run-id: ${{ github.run_id }}
          plan-artifact-id: ${{ needs.downstream-preparation.outputs.plan_artifact_id }}
          plan-artifact-digest: ${{ needs.downstream-preparation.outputs.plan_artifact_digest }}
          payload-artifact-id: ${{ fromJSON(needs.downstream-preparation.outputs.payload_artifact_ids).snap_candidate }}
          payload-artifact-digest: ${{ fromJSON(needs.downstream-preparation.outputs.payload_artifact_digests).snap_candidate }}
          source-sha: ${{ inputs.expected_source_sha }}
          release-id: ${{ inputs.release_id }}
          release-ref: ${{ inputs.release_ref }}
          store-credentials: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}

  pre-site-summary:
    name: Aggregate ten exact pre-site results
    needs: [downstream-preparation, publish-homebrew-tap, publish-scoop, publish-web-share, publish-linux-repository, record-linux-repository-policy, publish-crates, record-homebrew-core, record-winget, record-snap-stable, publish-chocolatey, publish-snap-candidate]
    if: ${{ !cancelled() && !failure() }}
    uses: ./.github/workflows/release-channel-summary.yml
    permissions:
      actions: read
      contents: read
    with:
      phase: pre-site
      receipt_run_id: ${{ github.run_id }}
      plan_artifact_id: ${{ needs.downstream-preparation.outputs.plan_artifact_id }}
      plan_artifact_digest: ${{ needs.downstream-preparation.outputs.plan_artifact_digest }}
      expected_source_sha: ${{ inputs.expected_source_sha }}
      release_id: ${{ inputs.release_id }}
      release_ref: ${{ inputs.release_ref }}

  prepare-rmux-io-handoff:
    name: Prepare manual rmux.io handoff
    needs: [downstream-preparation, pre-site-summary]
    uses: ./.github/workflows/release-rmux-io-payload.yml
    permissions:
      actions: read
      contents: read
    with:
      receipt_run_id: ${{ github.run_id }}
      plan_artifact_id: ${{ needs.downstream-preparation.outputs.plan_artifact_id }}
      plan_artifact_digest: ${{ needs.downstream-preparation.outputs.plan_artifact_digest }}
      pre_site_artifact_id: ${{ needs.pre-site-summary.outputs.summary_artifact_id }}
      pre_site_artifact_digest: ${{ needs.pre-site-summary.outputs.summary_artifact_digest }}
      expected_source_sha: ${{ inputs.expected_source_sha }}
      release_id: ${{ inputs.release_id }}
      release_ref: ${{ inputs.release_ref }}

  record-rmux-io-handoff:
    name: Record blocked automated rmux.io update
    needs: [downstream-preparation, pre-site-summary, prepare-rmux-io-handoff]
    uses: ./.github/workflows/release-rmux-io-channel.yml
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    with:
      receipt_run_id: ${{ github.run_id }}
      plan_artifact_id: ${{ needs.downstream-preparation.outputs.plan_artifact_id }}
      plan_artifact_digest: ${{ needs.downstream-preparation.outputs.plan_artifact_digest }}
      payload_artifact_id: ${{ needs.prepare-rmux-io-handoff.outputs.payload_artifact_id }}
      payload_artifact_digest: ${{ needs.prepare-rmux-io-handoff.outputs.payload_artifact_digest }}
      pre_site_artifact_id: ${{ needs.pre-site-summary.outputs.summary_artifact_id }}
      pre_site_artifact_digest: ${{ needs.pre-site-summary.outputs.summary_artifact_digest }}
      expected_source_sha: ${{ inputs.expected_source_sha }}
      release_id: ${{ inputs.release_id }}
      release_ref: ${{ inputs.release_ref }}

  final-channel-summary:
    name: Aggregate all eleven exact channel results
    needs: [downstream-preparation, pre-site-summary, record-rmux-io-handoff]
    uses: ./.github/workflows/release-channel-summary.yml
    permissions:
      actions: read
      contents: read
    with:
      phase: final
      receipt_run_id: ${{ github.run_id }}
