name: Publish exact signed Linux repositories

on:
  workflow_call:
    inputs:
      receipt_run_id: {required: true, type: string}
      plan_artifact_id: {required: true, type: string}
      plan_artifact_digest: {required: true, type: string}
      payload_artifact_id: {required: true, type: string}
      payload_artifact_digest: {required: true, type: string}
      repository_artifact_id: {required: true, type: string}
      repository_artifact_digest: {required: true, type: string}
      repository_artifact_run_id: {required: false, type: string, default: ""}
      repository_artifact_source_sha: {required: false, type: string, default: ""}
      expected_source_sha: {required: true, type: string}
      release_id: {required: true, type: string}
      release_ref: {required: true, type: string}
      recovery_mode: {required: false, type: boolean, default: false}
    secrets:
      RMUX_DOWNSTREAM_APP_PRIVATE_KEY:
        required: false

permissions: {}

jobs:
  publish:
    name: Publish exact APT and RPM repository trees
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    environment: release-publication
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    concurrency:
      group: rmux-channel-apt-rpm-${{ inputs.release_ref }}
      cancel-in-progress: false
    steps:
      - id: route
        name: Select the original or same-run recovery artifact route
        shell: bash
        env:
          RMUX_RECOVERY_MODE: ${{ inputs.recovery_mode }}
          RMUX_RECEIPT_RUN_ID: ${{ inputs.receipt_run_id }}
          RMUX_REPOSITORY_ARTIFACT_RUN_ID: ${{ inputs.repository_artifact_run_id }}
          RMUX_REPOSITORY_ARTIFACT_SOURCE_SHA: ${{ inputs.repository_artifact_source_sha }}
          RMUX_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          RMUX_RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = Helvesec/rmux
          test "$GITHUB_REPOSITORY_ID" = 1239918790
          test "$GITHUB_RUN_ATTEMPT" = 1
          [[ "$RMUX_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RMUX_RELEASE_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [ "$RMUX_RECOVERY_MODE" = true ]; then
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            test "$GITHUB_REF" = refs/heads/main
            test "$GITHUB_SHA" = "$RMUX_REPOSITORY_ARTIFACT_SOURCE_SHA"
            test "$GITHUB_RUN_ID" = "$RMUX_REPOSITORY_ARTIFACT_RUN_ID"
            test "$GITHUB_RUN_ID" != "$RMUX_RECEIPT_RUN_ID"
            [[ "$RMUX_REPOSITORY_ARTIFACT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            [[ "$RMUX_REPOSITORY_ARTIFACT_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
            lifecycle=completed-failure
            artifact_run_id="$RMUX_REPOSITORY_ARTIFACT_RUN_ID"
            artifact_source_sha="$RMUX_REPOSITORY_ARTIFACT_SOURCE_SHA"
          else
            test -z "$RMUX_REPOSITORY_ARTIFACT_RUN_ID"
            test -z "$RMUX_REPOSITORY_ARTIFACT_SOURCE_SHA"
            test "$GITHUB_RUN_ID" = "$RMUX_RECEIPT_RUN_ID"
            lifecycle=active-current
            artifact_run_id="$RMUX_RECEIPT_RUN_ID"
            artifact_source_sha="$RMUX_SOURCE_SHA"
          fi
          {
            echo "receipt_lifecycle=$lifecycle"
            echo "artifact_run_id=$artifact_run_id"
            echo "artifact_source_sha=$artifact_source_sha"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        if: inputs.recovery_mode == false
        with:
          persist-credentials: false

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        if: inputs.recovery_mode
        with:
          ref: ${{ inputs.repository_artifact_source_sha }}
          persist-credentials: false

      - id: prepare
        uses: ./.github/actions/release-channel-prepare
        with:
          channel: apt_rpm
          receipt-run-id: ${{ inputs.receipt_run_id }}
          plan-artifact-id: ${{ inputs.plan_artifact_id }}
          plan-artifact-digest: ${{ inputs.plan_artifact_digest }}
          payload-artifact-id: ${{ inputs.payload_artifact_id }}
          payload-artifact-digest: ${{ inputs.payload_artifact_digest }}
          source-sha: ${{ inputs.expected_source_sha }}
          release-id: ${{ inputs.release_id }}
          release-ref: ${{ inputs.release_ref }}
          receipt-run-lifecycle: ${{ steps.route.outputs.receipt_lifecycle }}

      - id: decision
        name: Resolve exact Linux repository execution authority
        shell: bash
        run: >-
          scripts/release/channel-execution.py
          --request "${{ steps.prepare.outputs.request }}" --channel apt_rpm
          --target-evidence "${{ steps.prepare.outputs.root }}/downstream-channel-target-evidence.json"
          --github-output "$GITHUB_OUTPUT"

      - name: Require the originally enabled channel to remain executable
        if: inputs.recovery_mode
        shell: bash
        env:
          RMUX_EXECUTE: ${{ steps.decision.outputs.execute }}
        run: test "$RMUX_EXECUTE" = true

      - name: Verify exact signed repository artifact identity
        if: steps.decision.outputs.execute == 'true' && !inputs.recovery_mode
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          scripts/release/actions-artifact.py verify
          --repository "$GITHUB_REPOSITORY" --run-id "${{ inputs.receipt_run_id }}"
          --artifact-id "${{ inputs.repository_artifact_id }}"
          --name "rmux-downstream-apt_rpm-signed-${{ inputs.expected_source_sha }}-${{ inputs.release_id }}"
          --expected-source-sha "$GITHUB_SHA"
          --expected-digest "${{ inputs.repository_artifact_digest }}"
          --expected-workflow-id 316435347
          --expected-workflow-path .github/workflows/release-receipt.yml
          --expected-event workflow_dispatch --expected-head-branch "$GITHUB_REF_NAME"
          --allow-running-current-run --max-attempts 1

      - id: signer
        name: Verify only the same-run manual signer artifact
        if: steps.decision.outputs.execute == 'true' && inputs.recovery_mode
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          scripts/release/linux_repository_recovery.py verify-signer-artifact
          --run-id "${{ steps.route.outputs.artifact_run_id }}"
          --protected-main-sha "${{ steps.route.outputs.artifact_source_sha }}"
          --artifact-id "${{ inputs.repository_artifact_id }}"
          --artifact-digest "${{ inputs.repository_artifact_digest }}"
          --receipt-run-id "${{ inputs.receipt_run_id }}"
          --plan-artifact-id "${{ inputs.plan_artifact_id }}"
          --plan-artifact-digest "${{ inputs.plan_artifact_digest }}"
          --payload-artifact-id "${{ inputs.payload_artifact_id }}"
          --payload-artifact-digest "${{ inputs.payload_artifact_digest }}"
          --source-sha "${{ inputs.expected_source_sha }}"
          --release-id "${{ inputs.release_id }}"
          --release-ref "${{ inputs.release_ref }}"
          --proof "${{ steps.prepare.outputs.root }}/linux-repository-recovery-artifact.json"
          --github-output "$GITHUB_OUTPUT"

      - name: Download only the exact signed repository artifact ID
        if: steps.decision.outputs.execute == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ inputs.repository_artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/rmux-linux-repository/publish
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.route.outputs.artifact_run_id }}

      - name: Rebind downloaded repository bytes to the verified signer run
        if: steps.decision.outputs.execute == 'true' && inputs.recovery_mode
        shell: bash
        run: >-
          scripts/release/linux_repository_recovery.py verify-bundle
          --repository-dir "$RUNNER_TEMP/rmux-linux-repository/publish"
          --proof "${{ steps.prepare.outputs.root }}/linux-repository-recovery-artifact.json"
          --artifact-id "${{ inputs.repository_artifact_id }}"

      - name: Remove verified recovery-only metadata from public repository bytes
        if: steps.decision.outputs.execute == 'true' && inputs.recovery_mode
        shell: bash
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/rmux-linux-repository/publish/LINUX_REPOSITORY_RECOVERY.json"
          test ! -L "$manifest"
          test -f "$manifest"
          rm -- "$manifest"
          test ! -e "$manifest"

      - name: Revalidate failed-receipt authority immediately before mutation
        if: steps.decision.outputs.execute == 'true' && inputs.recovery_mode
        uses: ./.github/actions/release-linux-repository-recovery-authorize
        with:
          receipt-run-id: ${{ inputs.receipt_run_id }}
          plan-artifact-id: ${{ inputs.plan_artifact_id }}
          plan-artifact-digest: ${{ inputs.plan_artifact_digest }}
          payload-artifact-id: ${{ inputs.payload_artifact_id }}
          payload-artifact-digest: ${{ inputs.payload_artifact_digest }}
          source-sha: ${{ inputs.expected_source_sha }}
          release-id: ${{ inputs.release_id }}
          release-ref: ${{ inputs.release_ref }}

      - id: app
        name: Mint a repository-scoped package writer token
        if: steps.decision.outputs.execute == 'true'
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.RMUX_DOWNSTREAM_APP_ID }}
          private-key: ${{ secrets.RMUX_DOWNSTREAM_APP_PRIVATE_KEY }}
          owner: Helvesec
          repositories: rmux-packages
          permission-actions: read
          permission-contents: write

      - id: writer
        name: Publish and reread exact signed repository bytes
        if: steps.decision.outputs.execute == 'true'
        shell: bash
        env:
          RMUX_DOWNSTREAM_TOKEN: ${{ steps.app.outputs.token }}
        run: >-
          scripts/release/publish-linux-repository.py
          --repository-dir "$RUNNER_TEMP/rmux-linux-repository/publish"
          --source-sha "${{ inputs.expected_source_sha }}"
          --release-ref "${{ inputs.release_ref }}"
          --target-evidence "${{ steps.prepare.outputs.root }}/downstream-channel-target-evidence.json"
          --github-output "$GITHUB_OUTPUT"

      - id: outcome
        name: Normalize executable and policy-only outcomes
        shell: bash
        env:
          RMUX_EXECUTE: ${{ steps.decision.outputs.execute }}
          RMUX_EXECUTED_STATE: ${{ steps.writer.outputs.state }}
          RMUX_BLOCKED_STATE: ${{ steps.decision.outputs.state }}
          RMUX_EXECUTED_MUTATION: ${{ steps.writer.outputs.mutation_started }}
          RMUX_BLOCKED_MUTATION: ${{ steps.decision.outputs.mutation_started }}
          RMUX_EXECUTED_REMOTE_ID: ${{ steps.writer.outputs.remote_request_id }}
          RMUX_BLOCKED_REMOTE_ID: ${{ steps.decision.outputs.remote_request_id }}
        run: |
          set -euo pipefail
          if [ "$RMUX_EXECUTE" = true ]; then
            state="$RMUX_EXECUTED_STATE"; mutation="$RMUX_EXECUTED_MUTATION"; remote_id="$RMUX_EXECUTED_REMOTE_ID"
          else
            state="$RMUX_BLOCKED_STATE"; mutation="$RMUX_BLOCKED_MUTATION"; remote_id="$RMUX_BLOCKED_REMOTE_ID"
          fi
          test -n "$state" && [[ "$mutation" =~ ^(true|false)$ ]]
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "mutation_started=$mutation" >> "$GITHUB_OUTPUT"
          echo "remote_request_id=$remote_id" >> "$GITHUB_OUTPUT"

      - name: Seal exact Linux repository result evidence
        if: ${{ !inputs.recovery_mode }}
        uses: ./.github/actions/release-channel-result
        with:
          channel: apt_rpm
          prepared-root: ${{ steps.prepare.outputs.root }}
          state: ${{ steps.outcome.outputs.state }}
          started-at: ${{ steps.decision.outputs.started_at }}
          mutation-started: ${{ steps.outcome.outputs.mutation_started }}
          remote-request-id: ${{ steps.outcome.outputs.remote_request_id }}
          target-evidence: ${{ steps.prepare.outputs.root }}/downstream-channel-target-evidence.json
          source-sha: ${{ inputs.expected_source_sha }}
          release-id: ${{ inputs.release_id }}
          release-ref: ${{ inputs.release_ref }}
          producer-workflow-path: .github/workflows/release-linux-repository-publish.yml
          runner-image: ubuntu-22.04

      - id: recovery-result
        name: Seal exact manual Linux recovery result evidence
        if: inputs.recovery_mode
        uses: ./.github/actions/release-channel-result
        with:
          channel: apt_rpm
          prepared-root: ${{ steps.prepare.outputs.root }}
          state: ${{ steps.outcome.outputs.state }}
          started-at: ${{ steps.decision.outputs.started_at }}
          mutation-started: ${{ steps.outcome.outputs.mutation_started }}
          remote-request-id: ${{ steps.outcome.outputs.remote_request_id }}
          target-evidence: ${{ steps.prepare.outputs.root }}/downstream-channel-target-evidence.json
          source-sha: ${{ inputs.expected_source_sha }}
          release-id: ${{ inputs.release_id }}
          release-ref: ${{ inputs.release_ref }}
          producer-workflow-id: ${{ steps.signer.outputs.workflow_id }}
          producer-workflow-path: .github/workflows/release-linux-repository-build.yml
          producer-head-sha: ${{ steps.route.outputs.artifact_source_sha }}
          producer-source-ref: refs/heads/main
          attestation-signer-workflow-path: .github/workflows/release-linux-repository-publish.yml
          runner-image: ubuntu-22.04
