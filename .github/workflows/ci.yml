        run: scripts/smoke-snap-package.sh "${{ steps.snapcraft.outputs.snap }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rmux-snap-${{ github.sha }}
