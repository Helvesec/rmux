      - name: Configure temporary paths
        shell: bash
        run: |
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "RMUX_TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Fetch locked dependencies
        run: cargo fetch --locked

      - name: cargo build
