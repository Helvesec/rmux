  nix-flake:
    name: Nix flake gate
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows-tests-gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: nix flake check
        run: nix flake check

      - name: nix build
        run: nix build .#packages.x86_64-linux.default --no-link

      - name: nix run version matches Cargo.toml
        run: |
          set -euo pipefail
          expected="$(python3 - <<'PY'
          import pathlib
          import sys

          sys.path.insert(0, "scripts")
          import toml_reader

          manifest = toml_reader.loads(
              pathlib.Path("Cargo.toml").read_text(encoding="utf-8")
          )
          print(manifest["workspace"]["package"]["version"])
          PY
          )"
          actual="$(nix run . -- -V)"
          if [ "$actual" != "rmux $expected" ]; then
            echo "::error::expected 'rmux $expected', got '$actual'"
            exit 1
          fi

