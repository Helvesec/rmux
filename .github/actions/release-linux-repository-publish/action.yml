name: Publish exact signed Linux repositories
description: Publish one receipt-bound APT and RPM repository tree from a protected parent job.

inputs:
  receipt-run-id: {required: true}
  plan-artifact-id: {required: true}
  plan-artifact-digest: {required: true}
  payload-artifact-id: {required: true}
  payload-artifact-digest: {required: true}
  repository-artifact-id: {required: true}
  repository-artifact-digest: {required: true}
  source-sha: {required: true}
  release-id: {required: true}
  release-ref: {required: true}
  app-id: {required: true}
  app-private-key: {required: true}

runs:
  using: composite
  steps:
    - name: Reject malformed Linux repository publication inputs
      shell: bash
      env:
        RMUX_RECEIPT_RUN_ID: ${{ inputs.receipt-run-id }}
        RMUX_REPOSITORY_ARTIFACT_ID: ${{ inputs.repository-artifact-id }}
        RMUX_REPOSITORY_ARTIFACT_DIGEST: ${{ inputs.repository-artifact-digest }}
        RMUX_SOURCE_SHA: ${{ inputs.source-sha }}
        RMUX_RELEASE_REF: ${{ inputs.release-ref }}
      run: |
        set -euo pipefail
        test "$GITHUB_REPOSITORY" = Helvesec/rmux
        test "$GITHUB_REPOSITORY_ID" = 1239918790
        test "$GITHUB_RUN_ATTEMPT" = 1
        test "$GITHUB_RUN_ID" = "$RMUX_RECEIPT_RUN_ID"
        [[ "$RMUX_REPOSITORY_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
        [[ "$RMUX_REPOSITORY_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
        [[ "$RMUX_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
        [[ "$RMUX_RELEASE_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

    - id: prepare
      uses: ./.github/actions/release-channel-prepare
      with:
        channel: apt_rpm
        receipt-run-id: ${{ inputs.receipt-run-id }}
        plan-artifact-id: ${{ inputs.plan-artifact-id }}
        plan-artifact-digest: ${{ inputs.plan-artifact-digest }}
        payload-artifact-id: ${{ inputs.payload-artifact-id }}
        payload-artifact-digest: ${{ inputs.payload-artifact-digest }}
        source-sha: ${{ inputs.source-sha }}
        release-id: ${{ inputs.release-id }}
        release-ref: ${{ inputs.release-ref }}
        receipt-run-lifecycle: active-current

    - id: decision
      name: Resolve exact Linux repository execution authority
      shell: bash
      run: >-
        scripts/release/channel-execution.py
        --request "${{ steps.prepare.outputs.request }}" --channel apt_rpm
        --target-evidence "${{ steps.prepare.outputs.root }}/downstream-channel-target-evidence.json"
        --github-output "$GITHUB_OUTPUT"

    - name: Verify exact signed repository artifact identity
      if: steps.decision.outputs.execute == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: >-
        scripts/release/actions-artifact.py verify
        --repository "$GITHUB_REPOSITORY" --run-id "${{ inputs.receipt-run-id }}"
        --artifact-id "${{ inputs.repository-artifact-id }}"
        --name "rmux-downstream-apt_rpm-signed-${{ inputs.source-sha }}-${{ inputs.release-id }}"
        --expected-source-sha "$GITHUB_SHA"
        --expected-digest "${{ inputs.repository-artifact-digest }}"
        --expected-workflow-id 316435347
        --expected-workflow-path .github/workflows/release-receipt.yml
        --expected-event workflow_dispatch --expected-head-branch "$GITHUB_REF_NAME"
        --allow-running-current-run --max-attempts 1

    - name: Download only the exact signed repository artifact ID
      if: steps.decision.outputs.execute == 'true'
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        artifact-ids: ${{ inputs.repository-artifact-id }}
        merge-multiple: true
        path: ${{ runner.temp }}/rmux-linux-repository/publish
        github-token: ${{ github.token }}
        repository: ${{ github.repository }}
        run-id: ${{ inputs.receipt-run-id }}

    - id: app
      name: Mint a repository-scoped package writer token
      if: steps.decision.outputs.execute == 'true'
      uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: Helvesec
        repositories: rmux-packages
        permission-actions: read
        permission-contents: write

    - id: writer
      name: Publish and reread exact signed repository bytes
      if: steps.decision.outputs.execute == 'true'
      shell: bash
      env:
        RMUX_DOWNSTREAM_TOKEN: ${{ steps.app.outputs.token }}
      run: >-
        scripts/release/publish-linux-repository.py
        --repository-dir "$RUNNER_TEMP/rmux-linux-repository/publish"
        --source-sha "${{ inputs.source-sha }}"
        --release-ref "${{ inputs.release-ref }}"
        --target-evidence "${{ steps.prepare.outputs.root }}/downstream-channel-target-evidence.json"
        --github-output "$GITHUB_OUTPUT"

    - id: outcome
      name: Normalize executable and policy-only outcomes
      shell: bash
      env:
        RMUX_EXECUTE: ${{ steps.decision.outputs.execute }}
        RMUX_EXECUTED_STATE: ${{ steps.writer.outputs.state }}
        RMUX_BLOCKED_STATE: ${{ steps.decision.outputs.state }}
        RMUX_EXECUTED_MUTATION: ${{ steps.writer.outputs.mutation_started }}
        RMUX_BLOCKED_MUTATION: ${{ steps.decision.outputs.mutation_started }}
        RMUX_EXECUTED_REMOTE_ID: ${{ steps.writer.outputs.remote_request_id }}
        RMUX_BLOCKED_REMOTE_ID: ${{ steps.decision.outputs.remote_request_id }}
      run: |
        set -euo pipefail
        if [ "$RMUX_EXECUTE" = true ]; then
          state="$RMUX_EXECUTED_STATE"
          mutation="$RMUX_EXECUTED_MUTATION"
          remote_id="$RMUX_EXECUTED_REMOTE_ID"
        else
          state="$RMUX_BLOCKED_STATE"
          mutation="$RMUX_BLOCKED_MUTATION"
          remote_id="$RMUX_BLOCKED_REMOTE_ID"
        fi
        test -n "$state" && [[ "$mutation" =~ ^(true|false)$ ]]
        echo "state=$state" >> "$GITHUB_OUTPUT"
        echo "mutation_started=$mutation" >> "$GITHUB_OUTPUT"
        echo "remote_request_id=$remote_id" >> "$GITHUB_OUTPUT"

    - name: Seal exact Linux repository result evidence
      uses: ./.github/actions/release-channel-result
      with:
        channel: apt_rpm
        prepared-root: ${{ steps.prepare.outputs.root }}
        state: ${{ steps.outcome.outputs.state }}
        started-at: ${{ steps.decision.outputs.started_at }}
        mutation-started: ${{ steps.outcome.outputs.mutation_started }}
        remote-request-id: ${{ steps.outcome.outputs.remote_request_id }}
        target-evidence: ${{ steps.prepare.outputs.root }}/downstream-channel-target-evidence.json
        source-sha: ${{ inputs.source-sha }}
        release-id: ${{ inputs.release-id }}
        release-ref: ${{ inputs.release-ref }}
        producer-workflow-path: .github/workflows/release-receipt.yml
        runner-image: ubuntu-22.04
