name: Authorize exact Linux repository signing recovery
description: Prove one failed receipt authorized APT/RPM and never reached publication.

inputs:
  receipt-run-id: {required: true}
  plan-artifact-id: {required: true}
  plan-artifact-digest: {required: true}
  payload-artifact-id: {required: true}
  payload-artifact-digest: {required: true}
  source-sha: {required: true}
  release-id: {required: true}
  release-ref: {required: true}

outputs:
  payload-root:
    value: ${{ steps.paths.outputs.payload_root }}

runs:
  using: composite
  steps:
    - id: paths
      name: Reject malformed or non-recovery invocation context
      shell: bash
      env:
        RMUX_RECEIPT_RUN_ID: ${{ inputs.receipt-run-id }}
        RMUX_PLAN_ARTIFACT_ID: ${{ inputs.plan-artifact-id }}
        RMUX_PLAN_ARTIFACT_DIGEST: ${{ inputs.plan-artifact-digest }}
        RMUX_PAYLOAD_ARTIFACT_ID: ${{ inputs.payload-artifact-id }}
        RMUX_PAYLOAD_ARTIFACT_DIGEST: ${{ inputs.payload-artifact-digest }}
        RMUX_SOURCE_SHA: ${{ inputs.source-sha }}
        RMUX_RELEASE_ID: ${{ inputs.release-id }}
        RMUX_RELEASE_REF: ${{ inputs.release-ref }}
      run: |
        set -euo pipefail
        test "$GITHUB_REPOSITORY" = Helvesec/rmux
        test "$GITHUB_REPOSITORY_ID" = 1239918790
        test "$GITHUB_RUN_ATTEMPT" = 1
        test "$GITHUB_EVENT_NAME" = workflow_dispatch
        test "$GITHUB_REF" = refs/heads/main
        test "$GITHUB_RUN_ID" != "$RMUX_RECEIPT_RUN_ID"
        for value in "$RMUX_RECEIPT_RUN_ID" "$RMUX_PLAN_ARTIFACT_ID" \
          "$RMUX_PAYLOAD_ARTIFACT_ID" "$RMUX_RELEASE_ID"; do
          [[ "$value" =~ ^[1-9][0-9]*$ ]]
        done
        [[ "$RMUX_PLAN_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
        [[ "$RMUX_PAYLOAD_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
        [[ "$RMUX_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
        [[ "$RMUX_RELEASE_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
        root="$RUNNER_TEMP/rmux-linux-recovery-authorization"
        test ! -e "$root"
        mkdir -p "$root/plan" "$root/payload" "$root/receipt" "$root/envelope"
        {
          echo "root=$root"
          echo "payload_root=$root/payload"
        } >> "$GITHUB_OUTPUT"

    - name: Fail closed before inspecting retained release evidence
      shell: bash
      run: scripts/release/assert-release-capability.py downstream_channels

    - name: Derive and verify the exact active signer workflow identity
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: >-
        scripts/release/linux_repository_recovery.py verify-signer-run
        --run-id "$GITHUB_RUN_ID" --protected-main-sha "$GITHUB_SHA"
        --github-output "${{ steps.paths.outputs.root }}/signer-workflow.env"

    - name: Verify exact plan and payload identities from the failed receipt
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        root="${{ steps.paths.outputs.root }}"
        common=(
          --repository "$GITHUB_REPOSITORY"
          --run-id "${{ inputs.receipt-run-id }}"
          --expected-source-sha "${{ inputs.source-sha }}"
          --expected-workflow-id 316435347
          --expected-workflow-path .github/workflows/release-receipt.yml
          --expected-event workflow_dispatch
          --expected-head-branch "${{ inputs.release-ref }}"
          --allow-completed-failed-run --max-attempts 1
        )
        scripts/release/actions-artifact.py verify "${common[@]}" \
          --artifact-id "${{ inputs.plan-artifact-id }}" \
          --name "rmux-downstream-plan-${{ inputs.source-sha }}-${{ inputs.release-id }}" \
          --expected-digest "${{ inputs.plan-artifact-digest }}" \
          > "$root/plan-artifact.json"
        scripts/release/actions-artifact.py verify "${common[@]}" \
          --artifact-id "${{ inputs.payload-artifact-id }}" \
          --name "rmux-downstream-apt_rpm-payload-${{ inputs.source-sha }}-${{ inputs.release-id }}" \
          --expected-digest "${{ inputs.payload-artifact-digest }}" \
          > "$root/payload-artifact.json"

    - name: Download only the exact failed-receipt plan
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        artifact-ids: ${{ inputs.plan-artifact-id }}
        merge-multiple: true
        path: ${{ steps.paths.outputs.root }}/plan
        github-token: ${{ github.token }}
        repository: ${{ github.repository }}
        run-id: ${{ inputs.receipt-run-id }}

    - name: Download only the exact failed-receipt APT/RPM payload
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        artifact-ids: ${{ inputs.payload-artifact-id }}
        merge-multiple: true
        path: ${{ steps.paths.outputs.root }}/payload
        github-token: ${{ github.token }}
        repository: ${{ github.repository }}
        run-id: ${{ inputs.receipt-run-id }}

    - id: receipt
      name: Prove failure occurred before any Linux publication evidence
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: >-
        scripts/release/linux_repository_recovery.py inspect-original
        --receipt-run-id "${{ inputs.receipt-run-id }}"
        --plan-artifact-id "${{ inputs.plan-artifact-id }}"
        --plan-artifact-digest "${{ inputs.plan-artifact-digest }}"
        --payload-artifact-id "${{ inputs.payload-artifact-id }}"
        --payload-artifact-digest "${{ inputs.payload-artifact-digest }}"
        --source-sha "${{ inputs.source-sha }}"
        --release-id "${{ inputs.release-id }}"
        --release-ref "${{ inputs.release-ref }}"
        --plan "${{ steps.paths.outputs.root }}/plan/downstream-channel-plan.json"
        --receipt-reference "${{ steps.paths.outputs.root }}/plan/receipt-reference.json"
        --github-output "$GITHUB_OUTPUT"

    - name: Verify exact failed-receipt authorization artifacts
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        root="${{ steps.paths.outputs.root }}"
        common=(
          --repository "$GITHUB_REPOSITORY"
          --run-id "${{ inputs.receipt-run-id }}"
          --expected-source-sha "${{ inputs.source-sha }}"
          --expected-workflow-id 316435347
          --expected-workflow-path .github/workflows/release-receipt.yml
          --expected-event workflow_dispatch
          --expected-head-branch "${{ inputs.release-ref }}"
          --allow-completed-failed-run --max-attempts 1
        )
        scripts/release/actions-artifact.py verify "${common[@]}" \
          --artifact-id "${{ steps.receipt.outputs.receipt_artifact_id }}" \
          --name "rmux-publication-receipt-${{ inputs.source-sha }}-${{ inputs.release-id }}" \
          --expected-digest "${{ steps.receipt.outputs.receipt_artifact_digest }}" \
          > "$root/receipt-artifact.json"
        scripts/release/actions-artifact.py verify "${common[@]}" \
          --artifact-id "${{ steps.receipt.outputs.receipt_envelope_artifact_id }}" \
          --name "rmux-publication-receipt-envelope-${{ inputs.source-sha }}-${{ inputs.release-id }}" \
          --expected-digest "${{ steps.receipt.outputs.receipt_envelope_artifact_digest }}" \
          > "$root/envelope-artifact.json"

    - name: Download only the exact failed-receipt predicate artifact
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        artifact-ids: ${{ steps.receipt.outputs.receipt_artifact_id }}
        merge-multiple: true
        path: ${{ steps.paths.outputs.root }}/receipt
        github-token: ${{ github.token }}
        repository: ${{ github.repository }}
        run-id: ${{ inputs.receipt-run-id }}

    - name: Download only the exact failed-receipt envelope artifact
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        artifact-ids: ${{ steps.receipt.outputs.receipt_envelope_artifact_id }}
        merge-multiple: true
        path: ${{ steps.paths.outputs.root }}/envelope
        github-token: ${{ github.token }}
        repository: ${{ github.repository }}
        run-id: ${{ inputs.receipt-run-id }}

    - id: gh
      name: Install the pinned failed-receipt attestation verifier
      shell: bash
      run: |
        set -euo pipefail
        install_root="$RUNNER_TEMP/rmux-gh-2.93.0-linux-recovery"
        scripts/release/install-gh-2.93.0.sh "$install_root"
        echo "binary=$install_root/gh" >> "$GITHUB_OUTPUT"

    - name: Rebuild and cryptographically verify exact receipt authorization
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        root="${{ steps.paths.outputs.root }}"
        scripts/release/verify-exact-file-set.py --root "$root/plan" \
          --file downstream-channel-plan.json \
          --file publication-receipt-predicate.json --file receipt-reference.json
        scripts/release/verify-exact-file-set.py --root "$root/receipt" \
          --file publication-receipt-predicate.json \
          --file publication-receipt.sigstore.json --file release-state.json
        scripts/release/verify-exact-file-set.py --root "$root/envelope" \
          --file publication-receipt-envelope.json
        cmp -- "$root/plan/publication-receipt-predicate.json" \
          "$root/receipt/publication-receipt-predicate.json"
        scripts/release/build-downstream-receipt-reference.py \
          --predicate "$root/receipt/publication-receipt-predicate.json" \
          --bundle "$root/receipt/publication-receipt.sigstore.json" \
          --envelope "$root/envelope/publication-receipt-envelope.json" \
          --predicate-artifact "$root/receipt-artifact.json" \
          --envelope-artifact "$root/envelope-artifact.json" \
          --source-sha "${{ inputs.source-sha }}" \
          --release-id "${{ inputs.release-id }}" \
          --release-ref "${{ inputs.release-ref }}" --release-kind stable \
          --receipt-run-id "${{ inputs.receipt-run-id }}" \
          --receipt-workflow-id 316435347 \
          --predicate-sha256 "${{ steps.receipt.outputs.receipt_predicate_sha256 }}" \
          --envelope-sha256 "${{ steps.receipt.outputs.receipt_envelope_sha256 }}" \
          --output "$root/rebuilt-receipt-reference.json"
        cmp -- "$root/plan/receipt-reference.json" "$root/rebuilt-receipt-reference.json"
        scripts/release/verify-receipt-attestation.py \
          --gh "${{ steps.gh.outputs.binary }}" \
          --release-state "$root/receipt/release-state.json" \
          --bundle "$root/receipt/publication-receipt.sigstore.json" \
          --predicate "$root/receipt/publication-receipt-predicate.json" \
          --source-sha "${{ inputs.source-sha }}" \
          --release-ref "${{ inputs.release-ref }}"
